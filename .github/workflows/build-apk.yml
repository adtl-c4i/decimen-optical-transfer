name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Capacitor Dependencies
        run: |
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android

      - name: Configure Relative Base Path in Vite
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('vite.config.ts', 'utf8');
            if (!content.includes('base:')) {
              content = content.replace('defineConfig({', 'defineConfig({\n  base: \"./\",');
              fs.writeFileSync('vite.config.ts', content);
            }
          "

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap init "Decimen Optical" "com.decimen.optical" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Add Camera Permission to Android Manifest
        run: |
          node -e "
            const fs = require('fs');
            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
