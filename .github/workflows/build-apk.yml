name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4        run: |
          python3 - << 'EOF'
          import os, shutil

          dist_dir = 'dist'
          assets_dir = os.path.join(dist_dir, 'assets')

          # Copy root assets folder into send/ and receive/ so relative scripts resolve
          for subfolder in ['send', 'receive']:
              target_assets = os.path.join(dist_dir, subfolder, 'assets')
              if os.path.exists(assets_dir) and not os.path.exists(target_assets):
                  shutil.copytree(assets_dir, target_assets)
          EOF

      - name: Initialize Capacitor
        run: npx cap init "Decimen Optical" "com.decimen.optical" --web-dir "dist"

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Camera Permissions & WebView Security Settings
        run: |
          python3 - << 'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          
          # Add Camera and Hardware features
          if 'android.permission.CAMERA' not in content:
              perms = '<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="true" />\n    <application'
              content = content.replace('<application', perms)
          
          # Ensure Mix Content / DOM Storage is permitted
          content = content.replace('<application', '<application android:usesCleartextTraffic="true"')
          
          with open(path, 'w') as f:
              f.write(content)
          EOF

      - name: Fix Duplicate Kotlin Stdlib Dependencies
        run: |
          python3 - << 'EOF'
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          fix = '''
          configurations.all {
              resolutionStrategy {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          '''
          if 'kotlin-stdlib-jdk7' not in content:
              content += fix
              with open(path, 'w') as f:
                  f.write(content)
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Decimen-Optical-Transfer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
