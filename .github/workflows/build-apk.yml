name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Project Dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npx vite build --base=./

      - name: Initialize Capacitor
        run: npx cap init "Decimen Optical" "com.decimen.optical" --web-dir "dist"

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Camera Permissions
        run: |
          python3 - << 'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          if 'android.permission.CAMERA' not in content:
              perms = '<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="true" />\n    <application'
              content = content.replace('<application', perms)
              with open(path, 'w') as f:
                  f.write(content)
          EOF

      - name: Fix Duplicate Kotlin Stdlib Dependencies
        run: |
          python3 - << 'EOF'
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          fix = '''
          configurations.all {
              resolutionStrategy {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          '''
          if 'kotlin-stdlib-jdk7' not in content:
              content += fix
              with open(path, 'w') as f:
                  f.write(content)
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Decimen-Optical-Transfer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
